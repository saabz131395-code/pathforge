# Content for the home page sections below the career paths.
# Edit freely: `python seed.py` is not needed, but restart the app to see changes.

tips:

- icon: 🎯
  title: One course at a time
  text: Pick one resource and finish it. Jumping between courses feels productive, but it is the most common reason beginners stall.

- icon: 🛠️
  title: Build early
  text: Start a small project once you are about a third of the way through a course. You learn far more from getting stuck than from watching.

- icon: 📝
  title: Write what you learned
  text: After each session, note three things you learned and one question. Short notes help you remember and show your progress.

- icon: 🗓️
  title: Fixed slots, not marathons
  text: Three or four regular sessions a week beat one long weekend session. Consistency matters more than hours.

- icon: 🙋
  title: Ask good questions
  text: When you are stuck, write down what you tried, what you expected and what happened. Often you'll solve it while writing, and if not, people can help quickly.

- icon: 🚩
  title: Avoid "earn in 7 days" offers
  text: Real skills take practice. Be careful with any course that guarantees income, asks you to pay to "unlock" jobs, or rushes you with countdown timers.

