freelance_steps:

- title: Build proof first
  text: Finish 2–3 portfolio projects in one skill before applying for work. Clients hire from evidence, not certificates.

- title: Make a focused profile
  text: Write one clear headline for one skill (e.g. "Manual & API testing for web apps"), add a real photo, and link your best work.

- title: Start small and specific
  text: Apply for small, well-defined jobs that match your projects. Read the whole brief before you reply.

- title: Write short, personal proposals
  text: Show you understood their problem in 2–3 lines, link one relevant sample, and ask one smart question. Skip copy-paste templates.

- title: Agree scope and price in writing
  text: Confirm deliverables, deadline and revisions before you start. Never pay anyone to "unlock" jobs, and keep payments on the platform.

- title: Deliver, then ask for a review
  text: Deliver on time, ask for feedback, and add the finished work (with permission) to your portfolio. Reviews compound.
